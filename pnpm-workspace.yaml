ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
# 只对 30 天内发布的版本做降级检查；更早的维护线补丁（如 vite@5、semver@6）晚于新主线的 trusted publishing 发布，会被误判为降级
trustPolicyIgnoreAfter: 43200
strictPeerDependencies: false
shamefullyHoist: true
shellEmulator: true

packages:
  - docs
  - packages/*

allowBuilds:
  '@parcel/watcher': false
  esbuild: false

catalog:
  '@antfu/eslint-config': ^9.5.1
  '@iconify-json/mdi': ^1.2.3
  '@playwright/test': ^1.64.1
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/react-gtm-module': 2.0.4
  '@unocss/reset': ^66.11.0
  '@vitejs/plugin-react': ^6.1.2
  '@vitejs/plugin-vue': ^6.0.10
  bumpp: ^12.3.0
  eslint: ^10.12.0
  happy-dom: ^21.0.1
  react: ^19.3.1
  react-dom: ^19.3.1
  react-gtm-module: 2.0.11
  sass: ^1.105.1
  tsdown: ^0.23.1
  typescript: ^6.0.3
  unocss: ^66.11.0
  unplugin-vue: ^8.0.0
  usehooks-ts: ^3.1.1
  vite: ^8.3.4
  vite-plugin-pwa: ^2.0.0
  vitepress: ^1.6.4
  vitest: ^5.0.4
  vue: ^3.5.44
  vue-tsc: ^3.3.13
