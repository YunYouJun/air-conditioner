<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>云空调 · 网页挂件安装</title>
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: light dark; line-height: 1.8; }
      body { max-width: 42rem; margin: 12rem auto 8rem; padding: 0 1.5rem; }
      pre { overflow: auto; padding: 1rem; background: light-dark(#edf5f7, #243036); border-radius: 0.75rem; }
      button { font: inherit; padding: 0.4rem 1rem; cursor: pointer; }
      a { color: light-dark(#056885, #76d6ed); }
    </style>
    <script defer src="./embed.js" data-placement="top-right"></script>
  </head>
  <body>
    <h1>给网页装一台小空调</h1>
    <p>右上角是机身，右下角可以打开遥控器。试试开机、调温，再收起遥控器：空调会继续运行。</p>
    <p>把下面这段代码放进网站的全局页头或页脚，无需安装 npm 包。默认关闭音效；加上 <code>data-audio="true"</code> 可启用声音。</p>
    <pre><code id="install"></code></pre>
    <button id="copy" type="button">复制安装代码</button>
    <p id="result" role="status"></p>
    <p>改成 <code>data-placement="top-left"</code> 可安装在左侧。键盘用 Tab、Enter / 空格操作，Esc 收起遥控器。手机可直接点按。</p>
    <p>自托管时将整个 <code>widget</code> 目录一起部署；跨站加载需允许字体和音频的跨域访问。<a href="https://github.com/YunYouJun/air-conditioner/blob/main/docs/guide/floating-widget.md">完整安装说明</a></p>
    <script>
      const code = '<script defer src="' + new URL('./embed.js', location.href).href + '" data-placement="top-right"><' + '/script>'
      document.getElementById('install').textContent = code
      document.getElementById('copy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(code)
          document.getElementById('result').textContent = '已复制，可以粘贴到网站模板。'
        } catch {
          document.getElementById('result').textContent = '请选中上方代码手动复制。'
        }
      })
    </script>
  </body>
</html>
