name: Release

# Publishes the core, Vue and widget packages under @yunlefun-home
# with npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance is attached.
# Each package must list this repository and `release.yml` as a trusted publisher
# on npmjs.com.
#
# Tag pushes also attach the Yun Home plugin and the CuteAC app
# (CuteAC-<version>.zip, Developer ID signed, notarized and stapled) to the
# GitHub Release, which the app's update check reads.

on:
  push:
    tags:
      - 'v*'
  # Publish the versions on the selected branch; already published versions are skipped.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to complete with npm packages and the Home plugin (optional)
        required: false
        type: string

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Verify tag matches package versions
        if: env.RELEASE_TAG != ''
        run: |
          for pkg in . packages/core packages/vue packages/widget packages/home-plugin; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "v$version" != "$RELEASE_TAG" ]; then
              echo "::error::$pkg is $version but the tag is $RELEASE_TAG"
              exit 1
            fi
          done

      # Core first: the Vue and widget packages depend on the same core version.
      - name: Publish
        run: |
          out="$RUNNER_TEMP/packages"
          mkdir -p "$out"
          for pkg in packages/core packages/vue packages/widget; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            # Prereleases go to their identifier (0.4.0-beta.1 -> beta), others to latest.
            dist_tag=latest
            case "$version" in
              *-*) dist_tag=$(echo "${version#*-}" | cut -d. -f1) ;;
            esac
            # pnpm pack rewrites workspace: ranges; npm publish performs the OIDC exchange.
            tarball=$(pnpm -C "$pkg" pack --pack-destination "$out" | tail -n 1)
            npm publish "$tarball" --access public --tag "$dist_tag"
          done

  # Build the Yun Home plugin package; tag pushes pass it to the release job.
  plugin:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || inputs.release_tag != ''
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: |
          pnpm -C packages/core run build
          pnpm -C packages/home-plugin run build

      - name: Upload artifact for release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: yunplugin
          path: |
            packages/home-plugin/dist/air-conditioner.yunplugin
            packages/home-plugin/dist/air-conditioner.yunplugin.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload to existing GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" --clobber \
            packages/home-plugin/dist/air-conditioner.yunplugin \
            packages/home-plugin/dist/air-conditioner.yunplugin.sha256

  # Build, sign and notarize the CuteAC menu bar app on tag pushes.
  cuteac:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: publish
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOME_DEVICE_KIT_PATH: ${{ github.workspace }}/.deps/home
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Check out HomeDeviceKit
        uses: actions/checkout@v6
        with:
          repository: YunLeFun/home
          ref: 932bb3a1ad908097586631ad3bd641443a2c81ca # Home 0.2.2
          path: .deps/home

      - name: Verify tag matches the app version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Test kit
        run: swift test

      - name: Test native connectivity
        run: swift test --package-path apps/macos

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py install

      - name: Bundle
        working-directory: apps/macos
        run: scripts/bundle.sh

      - name: Verify Developer ID signature
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py verify apps/macos/build/CuteAC.app fun.yunle.cute-ac

      - name: Verify relocated app launch
        run: python3 apps/macos/scripts/verify-bundle.py

      - name: Remove temporary signing keychain
        if: always() && env.MACOS_SIGNING_DIR != ''
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py cleanup

      - name: Notarize, staple and zip
        env:
          NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          NOTARY_TIMEOUT: 20m
        run: bash apps/macos/scripts/notarize.sh apps/macos/build/CuteAC.app "CuteAC-${GITHUB_REF_NAME#v}.zip"

      - name: Upload artifact for release
        uses: actions/upload-artifact@v7
        with:
          name: cuteac-app
          path: CuteAC-*.zip
          if-no-files-found: error
          retention-days: 14

  # Publish the GitHub Release only after npm packages, Home plugin and notarized CuteAC all succeed.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [publish, plugin, cuteac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Create and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets_dir="${RUNNER_TEMP}/release-assets"
          files=(
            "$assets_dir/air-conditioner.yunplugin"
            "$assets_dir/air-conditioner.yunplugin.sha256"
            "$assets_dir/CuteAC-${version}.zip"
          )
          for file in "${files[@]}"; do
            test -f "$file" || { echo "::error::Missing release asset: $file"; exit 1; }
          done

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          notes=(--generate-notes)
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi

          is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || echo true)"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            create_flags=(--draft --verify-tag "${notes[@]}" --title "云空调 CuteAC ${version}")
            if [ "$prerelease" = true ]; then
              create_flags+=(--prerelease --latest=false)
            fi
            gh release create "$GITHUB_REF_NAME" "${create_flags[@]}"
          fi

          gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}"
          if [ "$is_draft" = true ]; then
            if [ "$prerelease" = true ]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
            else
              gh release edit "$GITHUB_REF_NAME" --draft=false --latest
            fi
          fi
