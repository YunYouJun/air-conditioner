name: Release

# Publishes @yunlefun-home/air-conditioner-core and @yunlefun-home/air-conditioner
# with npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance is attached.
# Each package must list this repository and `release.yml` as a trusted publisher
# on npmjs.com.
#
# Tag pushes also attach the Yun Home plugin and the CuteAC app
# (CuteAC-<version>.zip) to the GitHub Release, which the app's update check reads.

on:
  push:
    tags:
      - 'v*'
  # Publish the versions on the selected branch; already published versions are skipped.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to complete with npm packages and the Home plugin (optional)
        required: false
        type: string

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

permissions:
  contents: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check

      - name: Verify tag matches package versions
        if: env.RELEASE_TAG != ''
        run: |
          for pkg in . packages/core packages/vue packages/home-plugin; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "v$version" != "$RELEASE_TAG" ]; then
              echo "::error::$pkg is $version but the tag is $RELEASE_TAG"
              exit 1
            fi
          done

      # Core first: the Vue package depends on the same core version.
      - name: Publish
        run: |
          out="$RUNNER_TEMP/packages"
          mkdir -p "$out"
          for pkg in packages/core packages/vue; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            # Prereleases go to their identifier (0.4.0-beta.1 -> beta), others to latest.
            dist_tag=latest
            case "$version" in
              *-*) dist_tag=$(echo "${version#*-}" | cut -d. -f1) ;;
            esac
            # pnpm pack rewrites workspace: ranges; npm publish performs the OIDC exchange.
            tarball=$(pnpm -C "$pkg" pack --pack-destination "$out" | tail -n 1)
            npm publish "$tarball" --access public --tag "$dist_tag"
          done

  # Attach the Yun Home plugin package to the GitHub Release for this tag.
  plugin:
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: |
          pnpm -C packages/core run build
          pnpm -C packages/home-plugin run build

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          notes=(--generate-notes)
          if [ -f "docs/releases/$RELEASE_TAG.md" ]; then
            notes=(--notes-file "docs/releases/$RELEASE_TAG.md")
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag "${notes[@]}" --title "云空调 CuteAC ${RELEASE_TAG#v}" \
            || gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" --clobber \
            packages/home-plugin/dist/air-conditioner.yunplugin \
            packages/home-plugin/dist/air-conditioner.yunplugin.sha256

  # Attach the CuteAC menu bar app to the GitHub Release for this tag. The app
  # reads releases tagged v* and links to CuteAC-<version>.zip.
  cuteac:
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOME_DEVICE_KIT_PATH: ${{ github.workspace }}/.deps/home
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Check out HomeDeviceKit
        uses: actions/checkout@v6
        with:
          repository: YunLeFun/home
          ref: 932bb3a1ad908097586631ad3bd641443a2c81ca # Home 0.2.2
          path: .deps/home

      - name: Verify tag matches the app version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Test kit
        run: swift test

      - name: Test native connectivity
        run: swift test --package-path apps/macos

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py install

      - name: Bundle
        working-directory: apps/macos
        run: scripts/bundle.sh

      - name: Verify Developer ID signature
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py verify apps/macos/build/CuteAC.app fun.yunle.cute-ac

      - name: Verify relocated app launch
        run: python3 apps/macos/scripts/verify-bundle.py

      - name: Remove temporary signing keychain
        if: always() && env.MACOS_SIGNING_DIR != ''
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py cleanup

      - name: Zip
        run: ditto -c -k --keepParent apps/macos/build/CuteAC.app "CuteAC-${GITHUB_REF_NAME#v}.zip"

      # The plugin job may create the release first; either order works.
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag "${notes[@]}" --title "云空调 CuteAC ${GITHUB_REF_NAME#v}" \
            || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --clobber "CuteAC-${GITHUB_REF_NAME#v}.zip"
