name: macOS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/macos/**'
      - Package.swift
      - .github/workflows/macos.yml

  pull_request:
    branches:
      - main
    paths:
      - 'apps/macos/**'
      - Package.swift
      - .github/workflows/macos.yml

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOME_DEVICE_KIT_PATH: ${{ github.workspace }}/.deps/home
      MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
      MACOS_SIGNING_TEAM_ID: ${{ vars.MACOS_SIGNING_TEAM_ID }}
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6

      - name: Check out HomeDeviceKit
        uses: actions/checkout@v6
        with:
          repository: YunLeFun/home
          ref: 932bb3a1ad908097586631ad3bd641443a2c81ca # Home 0.2.2
          path: .deps/home

      - name: Swift version
        run: swift --version

      # CuteACKit is the repository root package (also consumed by Yun Home).
      - name: Test kit
        working-directory: .
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Test native connectivity
        run: swift test

      - name: Import Developer ID for main branch validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py install

      - name: Bundle
        run: scripts/bundle.sh

      - name: Verify Developer ID signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py verify apps/macos/build/CuteAC.app fun.yunle.cute-ac

      - name: Verify relocated app launch and snapshots
        env:
          BUNDLE_VERIFY_OUTPUT_DIR: ${{ runner.temp }}/bundle-check
        run: python3 scripts/verify-bundle.py

      - name: Remove temporary signing keychain
        if: always() && env.MACOS_SIGNING_DIR != ''
        working-directory: .
        run: python3 .deps/home/apps/macos/scripts/ci-signing.py cleanup

      - uses: actions/upload-artifact@v7
        with:
          name: macos-snapshots
          path: ${{ runner.temp }}/bundle-check/snapshots/
          retention-days: 14
