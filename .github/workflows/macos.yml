name: macOS

on:
  push:
    branches:
      - main
    paths:
      - 'apps/macos/**'
      - Package.swift
      - .github/workflows/macos.yml

  pull_request:
    branches:
      - main
    paths:
      - 'apps/macos/**'
      - Package.swift
      - .github/workflows/macos.yml

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOME_DEVICE_KIT_PATH: ${{ github.workspace }}/.deps/home
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v6

      - name: Check out HomeDeviceKit
        uses: actions/checkout@v6
        with:
          repository: YunLeFun/home
          ref: 9e71679dd0ef0f0e5329413e910e46c17d945a4c # Shared HA bindings and device collection
          path: .deps/home

      - name: Swift version
        run: swift --version

      # CuteACKit is the repository root package (also consumed by Yun Home).
      - name: Test kit
        working-directory: .
        run: swift test

      - name: Build
        run: swift build -c release

      - name: Test native connectivity
        run: swift test

      - name: Bundle
        run: scripts/bundle.sh

      - name: Snapshot
        run: |
          .build/release/CuteAC --snapshot "$RUNNER_TEMP/snap"
          test "$(ls "$RUNNER_TEMP"/snap/*.png | wc -l)" -eq 6

      - uses: actions/upload-artifact@v7
        with:
          name: macos-snapshots
          path: ${{ runner.temp }}/snap/
          retention-days: 14
